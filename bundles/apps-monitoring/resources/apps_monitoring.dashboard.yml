resources:
  dashboards:
    apps_monitoring_dashboard:
      display_name: Databricks Apps monitoring
      warehouse_id: ${var.warehouse_id}
      # Dataset SQL uses ${var.name_prefix}-prefixed table names without a
      # catalog or schema; these fill in catalog/schema.
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
      # The dashboard JSON is inline (not file_path) so the bundle substitutes
      # ${var.name_prefix} into the dataset SQL. The CLI does not interpolate
      # variables inside a file_path .lvdash.json.
      serialized_dashboard: |
        {
          "datasets": [
            {
              "name": "ds_apps",
              "displayName": "Apps with flags",
              "queryLines": [
                "WITH snap AS (\n",
                "  SELECT * FROM ${var.name_prefix}apps_inventory_snapshot\n",
                "),\n",
                "creator_counts AS (\n",
                "  SELECT creator, count(*) AS creator_app_count\n",
                "  FROM snap\n",
                "  GROUP BY creator\n",
                "),\n",
                "obo AS (\n",
                "  SELECT\n",
                "    s.app_name,\n",
                "    max(o.activity_date) AS last_obo_date,\n",
                "    coalesce(sum(CASE WHEN o.activity_date >= date_sub(current_date(), least(greatest(:usage_days, 1), 90)) THEN o.event_count END), 0) AS obo_events_window,\n",
                "    count(DISTINCT CASE WHEN o.activity_date >= date_sub(current_date(), least(greatest(:usage_days, 1), 90)) THEN o.user_email END) AS obo_users_window\n",
                "  FROM snap s\n",
                "  INNER JOIN ${var.name_prefix}app_obo_activity_daily o\n",
                "    ON o.oauth2_app_client_id = s.oauth2_app_client_id\n",
                "    AND o.user_email LIKE '%@%'\n",
                "    AND o.user_email IS DISTINCT FROM s.service_principal_client_id\n",
                "  GROUP BY s.app_name\n",
                "),\n",
                "logins AS (\n",
                "  SELECT\n",
                "    s.app_name,\n",
                "    max(a.activity_date) AS last_login_date,\n",
                "    count(DISTINCT CASE WHEN a.activity_date >= date_sub(current_date(), least(greatest(:usage_days, 1), 90)) THEN a.user_email END) AS login_users_window\n",
                "  FROM snap s\n",
                "  INNER JOIN ${var.name_prefix}app_access_activity_daily a\n",
                "    ON a.signal = 'login'\n",
                "    AND a.oauth2_app_client_id = s.oauth2_app_client_id\n",
                "    AND a.user_email LIKE '%@%'\n",
                "    AND a.user_email IS DISTINCT FROM s.service_principal_client_id\n",
                "  GROUP BY s.app_name\n",
                "),\n",
                "sp AS (\n",
                "  SELECT\n",
                "    s.app_name,\n",
                "    max(a.activity_date) AS last_sp_activity_date,\n",
                "    coalesce(sum(CASE WHEN a.activity_date >= date_sub(current_date(), least(greatest(:usage_days, 1), 90)) THEN a.event_count END), 0) AS sp_events_window\n",
                "  FROM snap s\n",
                "  INNER JOIN ${var.name_prefix}app_access_activity_daily a\n",
                "    ON a.signal = 'sp_activity'\n",
                "    AND a.user_email = s.service_principal_client_id\n",
                "  GROUP BY s.app_name\n",
                "),\n",
                "billed AS (\n",
                "  SELECT\n",
                "    u.usage_metadata.app_id AS app_id,\n",
                "    coalesce(sum(CASE WHEN u.usage_date >= date_sub(current_date(), least(greatest(:usage_days, 1), 90)) THEN u.usage_quantity END), 0) AS dbus_window,\n",
                "    max(u.usage_date) AS last_billed_date\n",
                "  FROM system.billing.usage u\n",
                "  WHERE u.usage_date >= date_sub(current_date(), 90)\n",
                "    AND u.usage_metadata.app_id IS NOT NULL\n",
                "    AND u.workspace_id IN (SELECT DISTINCT workspace_id FROM snap)\n",
                "  GROUP BY u.usage_metadata.app_id\n",
                "),\n",
                "facts AS (\n",
                "  SELECT\n",
                "    s.app_name,\n",
                "    s.app_id,\n",
                "    s.creator,\n",
                "    s.creator_type,\n",
                "    s.creator_active,\n",
                "    s.metadata_incomplete,\n",
                "    c.creator_app_count,\n",
                "    s.app_state,\n",
                "    s.compute_state,\n",
                "    s.active_deployment_id,\n",
                "    coalesce(s.active_deployment_update_time, s.active_deployment_create_time) AS last_deploy_time,\n",
                "    s.create_time,\n",
                "    s.update_time,\n",
                "    greatest(\n",
                "      coalesce(s.active_deployment_update_time, s.active_deployment_create_time, s.create_time),\n",
                "      coalesce(s.update_time, s.create_time)\n",
                "    ) AS last_change_time,\n",
                "    array_join(s.user_api_scopes, ', ') AS user_api_scopes,\n",
                "    l.last_login_date,\n",
                "    coalesce(l.login_users_window, 0) AS human_login_users,\n",
                "    coalesce(l.login_users_window, 0) > 0 AS has_human_login,\n",
                "    o.last_obo_date,\n",
                "    coalesce(o.obo_users_window, 0) AS human_obo_users,\n",
                "    coalesce(o.obo_events_window, 0) AS human_obo_events,\n",
                "    p.last_sp_activity_date,\n",
                "    coalesce(p.sp_events_window, 0) AS sp_events_window,\n",
                "    CASE\n",
                "      WHEN coalesce(p.sp_events_window, 0) > 0 AND coalesce(o.obo_events_window, 0) > 0 THEN 'SP and OBO'\n",
                "      WHEN coalesce(p.sp_events_window, 0) > 0 THEN 'SP-only'\n",
                "      WHEN coalesce(o.obo_events_window, 0) > 0 THEN 'OBO'\n",
                "      ELSE 'Idle'\n",
                "    END AS activity_type,\n",
                "    coalesce(b.dbus_window, 0) AS dbus_window,\n",
                "    b.last_billed_date,\n",
                "    s.url,\n",
                "    s.snapshot_time,\n",
                "    CASE WHEN coalesce(l.login_users_window, 0) = 0 AND coalesce(o.obo_events_window, 0) = 0 THEN 1 ELSE 0 END AS flag_no_usage,\n",
                "    CASE WHEN coalesce(b.dbus_window, 0) > 0 AND coalesce(l.login_users_window, 0) = 0 AND coalesce(o.obo_users_window, 0) = 0 THEN 1 ELSE 0 END AS flag_billed_no_users,\n",
                "    CASE WHEN s.user_api_scopes IS NOT NULL AND size(s.user_api_scopes) = 0 AND coalesce(o.obo_events_window, 0) = 0 THEN 1 ELSE 0 END AS flag_sp_only,\n",
                "    CASE WHEN coalesce(size(s.user_api_scopes) > 0, false) THEN 1 ELSE 0 END AS has_user_scopes,\n",
                "    CASE WHEN s.user_api_scopes IS NULL THEN 1 ELSE 0 END AS flag_scopes_unknown,\n",
                "    CASE WHEN s.compute_state IN ('STOPPED', 'ERROR') OR s.active_deployment_id IS NULL THEN 1 ELSE 0 END AS flag_stopped_or_never_deployed,\n",
                "    CASE WHEN greatest(\n",
                "        coalesce(s.active_deployment_update_time, s.active_deployment_create_time, s.create_time),\n",
                "        coalesce(s.update_time, s.create_time)\n",
                "      ) < date_sub(current_date(), :stale_days) THEN 1 ELSE 0 END AS flag_stale_deploy,\n",
                "    CASE WHEN s.creator_active = false THEN 1 ELSE 0 END AS flag_creator_inactive,\n",
                "    CASE WHEN s.creator_active IS NULL THEN 1 ELSE 0 END AS flag_creator_unknown,\n",
                "    CASE WHEN c.creator_app_count > :creator_app_threshold THEN 1 ELSE 0 END AS flag_over_creator\n",
                "  FROM snap s\n",
                "  LEFT JOIN creator_counts c ON c.creator <=> s.creator\n",
                "  LEFT JOIN obo o ON o.app_name = s.app_name\n",
                "  LEFT JOIN logins l ON l.app_name = s.app_name\n",
                "  LEFT JOIN sp p ON p.app_name = s.app_name\n",
                "  LEFT JOIN billed b ON b.app_id = s.app_id\n",
                ")\n",
                "SELECT\n",
                "  *,\n",
                "  concat_ws(', ',\n",
                "    CASE WHEN flag_no_usage = 1 THEN 'no_usage' END,\n",
                "    CASE WHEN flag_billed_no_users = 1 THEN 'billed_no_users' END,\n",
                "    CASE WHEN flag_sp_only = 1 THEN 'sp_only' END,\n",
                "    CASE WHEN flag_no_usage = 1 AND activity_type = 'Idle' THEN 'idle' END,\n",
                "    CASE WHEN flag_stopped_or_never_deployed = 1 THEN 'stopped_or_never_deployed' END,\n",
                "    CASE WHEN flag_stale_deploy = 1 THEN 'stale_deploy' END,\n",
                "    CASE WHEN flag_creator_inactive = 1 THEN 'creator_inactive' END,\n",
                "    CASE WHEN flag_over_creator = 1 THEN 'over_creator' END,\n",
                "    CASE WHEN flag_creator_unknown = 1 THEN 'creator_unknown' END,\n",
                "    CASE WHEN flag_scopes_unknown = 1 THEN 'scopes_unknown' END\n",
                "  ) AS reasons,\n",
                "  CASE\n",
                "    WHEN flag_no_usage = 1\n",
                "      AND (has_user_scopes = 1 OR activity_type = 'Idle' OR flag_stopped_or_never_deployed = 1 OR flag_stale_deploy = 1 OR flag_creator_inactive = 1)\n",
                "      THEN 1 ELSE 0\n",
                "  END AS is_deletion_candidate,\n",
                "  CASE\n",
                "    WHEN flag_no_usage = 1\n",
                "      AND (has_user_scopes = 1 OR activity_type = 'Idle' OR flag_stopped_or_never_deployed = 1 OR flag_stale_deploy = 1 OR flag_creator_inactive = 1)\n",
                "      THEN 'Deletion candidate' ELSE 'Keep'\n",
                "  END AS candidate_label,\n",
                "  CASE WHEN flag_billed_no_users = 1 THEN dbus_window ELSE 0 END AS wasted_dbus\n",
                "FROM facts\n",
                "ORDER BY is_deletion_candidate DESC, dbus_window DESC, app_name\n"
              ],
              "parameters": [
                {
                  "displayName": "usage_days",
                  "keyword": "usage_days",
                  "dataType": "INTEGER",
                  "defaultSelection": {
                    "values": {
                      "dataType": "INTEGER",
                      "values": [
                        {
                          "value": "30"
                        }
                      ]
                    }
                  }
                },
                {
                  "displayName": "stale_days",
                  "keyword": "stale_days",
                  "dataType": "INTEGER",
                  "defaultSelection": {
                    "values": {
                      "dataType": "INTEGER",
                      "values": [
                        {
                          "value": "60"
                        }
                      ]
                    }
                  }
                },
                {
                  "displayName": "creator_app_threshold",
                  "keyword": "creator_app_threshold",
                  "dataType": "INTEGER",
                  "defaultSelection": {
                    "values": {
                      "dataType": "INTEGER",
                      "values": [
                        {
                          "value": "3"
                        }
                      ]
                    }
                  }
                }
              ]
            },
            {
              "name": "ds_over_creator_apps",
              "displayName": "Apps owned by creators over threshold",
              "queryLines": [
                "WITH creator_counts AS (\n",
                "  SELECT creator, count(*) AS creator_app_count\n",
                "  FROM ${var.name_prefix}apps_inventory_snapshot\n",
                "  GROUP BY creator\n",
                ")\n",
                "SELECT\n",
                "  s.creator,\n",
                "  s.creator_type,\n",
                "  s.creator_active,\n",
                "  c.creator_app_count,\n",
                "  s.app_name,\n",
                "  s.compute_state,\n",
                "  s.create_time,\n",
                "  s.update_time\n",
                "FROM ${var.name_prefix}apps_inventory_snapshot s\n",
                "INNER JOIN creator_counts c ON c.creator <=> s.creator\n",
                "WHERE c.creator_app_count > :creator_app_threshold\n",
                "ORDER BY c.creator_app_count DESC, s.creator, s.app_name\n"
              ],
              "parameters": [
                {
                  "displayName": "creator_app_threshold",
                  "keyword": "creator_app_threshold",
                  "dataType": "INTEGER",
                  "defaultSelection": {
                    "values": {
                      "dataType": "INTEGER",
                      "values": [
                        {
                          "value": "3"
                        }
                      ]
                    }
                  }
                }
              ]
            },
            {
              "name": "ds_spend_trend",
              "displayName": "Apps daily DBUs",
              "queryLines": [
                "WITH daily AS (\n",
                "  SELECT\n",
                "    u.usage_date,\n",
                "    coalesce(s.app_name, u.usage_metadata.app_name, u.usage_metadata.app_id) AS app_name,\n",
                "    sum(u.usage_quantity) AS dbus\n",
                "  FROM system.billing.usage u\n",
                "  LEFT JOIN ${var.name_prefix}apps_inventory_snapshot s ON s.app_id = u.usage_metadata.app_id\n",
                "  WHERE u.usage_date >= date_sub(current_date(), 90)\n",
                "    AND u.usage_metadata.app_id IS NOT NULL\n",
                "    AND u.workspace_id IN (SELECT DISTINCT workspace_id FROM ${var.name_prefix}apps_inventory_snapshot)\n",
                "  GROUP BY\n",
                "    u.usage_date,\n",
                "    coalesce(s.app_name, u.usage_metadata.app_name, u.usage_metadata.app_id)\n",
                "),\n",
                "ranked AS (\n",
                "  SELECT app_name, row_number() OVER (ORDER BY sum(dbus) DESC, app_name) AS spend_rank\n",
                "  FROM daily\n",
                "  GROUP BY app_name\n",
                ")\n",
                "SELECT\n",
                "  d.usage_date,\n",
                "  CASE WHEN r.spend_rank <= 7 THEN d.app_name ELSE 'Other' END AS app_series,\n",
                "  sum(d.dbus) AS dbus\n",
                "FROM daily d\n",
                "INNER JOIN ranked r ON r.app_name = d.app_name\n",
                "GROUP BY d.usage_date, CASE WHEN r.spend_rank <= 7 THEN d.app_name ELSE 'Other' END\n",
                "ORDER BY d.usage_date\n"
              ]
            },
            {
              "name": "ds_usage_trend",
              "displayName": "Apps daily human OBO usage",
              "queryLines": [
                "SELECT\n",
                "  o.activity_date,\n",
                "  count(DISTINCT o.user_email) AS obo_users,\n",
                "  sum(o.event_count) AS obo_events,\n",
                "  count(DISTINCT s.app_name) AS apps_with_obo\n",
                "FROM ${var.name_prefix}app_obo_activity_daily o\n",
                "INNER JOIN ${var.name_prefix}apps_inventory_snapshot s\n",
                "  ON o.oauth2_app_client_id = s.oauth2_app_client_id\n",
                "  AND o.user_email LIKE '%@%'\n",
                "  AND o.user_email IS DISTINCT FROM s.service_principal_client_id\n",
                "GROUP BY o.activity_date\n",
                "ORDER BY o.activity_date\n"
              ]
            }
          ],
          "pages": [
            {
              "name": "overview",
              "displayName": "Overview",
              "pageType": "PAGE_TYPE_CANVAS",
              "layoutVersion": "GRID_V1",
              "layout": [
                {
                  "widget": {
                    "name": "ov_title",
                    "multilineTextboxSpec": {
                      "lines": [
                        "# Databricks Apps monitoring\n",
                        "\n",
                        "What can we safely delete? Usage = a human signing in to the app or human on-behalf-of (OBO) activity, not billing and not the app's own service principal. activity_type says how the app is active (SP-only, OBO, SP and OBO, Idle). Thresholds are set on the Filters page. Refreshed daily at 06:00 UTC by the apps-monitoring job.\n"
                      ]
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 0,
                    "width": 12,
                    "height": 2
                  }
                },
                {
                  "widget": {
                    "name": "kpi_total_apps",
                    "queries": [
                      {
                        "name": "main_query",
                        "query": {
                          "datasetName": "ds_apps",
                          "fields": [
                            {
                              "name": "count(app_name)",
                              "expression": "COUNT(`app_name`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      }
                    ],
                    "spec": {
                      "version": 2,
                      "widgetType": "counter",
                      "encodings": {
                        "value": {
                          "fieldName": "count(app_name)",
                          "displayName": "Total apps"
                        }
                      },
                      "frame": {
                        "showTitle": true,
                        "title": "Total apps",
                        "description": "Apps in the latest inventory snapshot",
                        "showDescription": true
                      }
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 2,
                    "width": 4,
                    "height": 3
                  }
                },
                {
                  "widget": {
                    "name": "kpi_no_usage",
                    "queries": [
                      {
                        "name": "main_query",
                        "query": {
                          "datasetName": "ds_apps",
                          "fields": [
                            {
                              "name": "sum(flag_no_usage)",
                              "expression": "SUM(`flag_no_usage`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      }
                    ],
                    "spec": {
                      "version": 2,
                      "widgetType": "counter",
                      "encodings": {
                        "value": {
                          "fieldName": "sum(flag_no_usage)",
                          "displayName": "Apps with no usage"
                        }
                      },
                      "frame": {
                        "showTitle": true,
                        "title": "Apps with no usage",
                        "description": "No human sign-in and no human OBO activity in the usage window (max 90 days)",
                        "showDescription": true
                      }
                    }
                  },
                  "position": {
                    "x": 4,
                    "y": 2,
                    "width": 4,
                    "height": 3
                  }
                },
                {
                  "widget": {
                    "name": "kpi_candidates",
                    "queries": [
                      {
                        "name": "main_query",
                        "query": {
                          "datasetName": "ds_apps",
                          "fields": [
                            {
                              "name": "sum(is_deletion_candidate)",
                              "expression": "SUM(`is_deletion_candidate`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      }
                    ],
                    "spec": {
                      "version": 2,
                      "widgetType": "counter",
                      "encodings": {
                        "value": {
                          "fieldName": "sum(is_deletion_candidate)",
                          "displayName": "Deletion candidates"
                        }
                      },
                      "frame": {
                        "showTitle": true,
                        "title": "Deletion candidates",
                        "description": "No usage, plus user-facing scopes, Idle activity, or a sign of abandonment",
                        "showDescription": true
                      }
                    }
                  },
                  "position": {
                    "x": 8,
                    "y": 2,
                    "width": 4,
                    "height": 3
                  }
                },
                {
                  "widget": {
                    "name": "kpi_over_creators",
                    "queries": [
                      {
                        "name": "main_query",
                        "query": {
                          "datasetName": "ds_over_creator_apps",
                          "fields": [
                            {
                              "name": "countdistinct(creator)",
                              "expression": "COUNT(DISTINCT `creator`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      }
                    ],
                    "spec": {
                      "version": 2,
                      "widgetType": "counter",
                      "encodings": {
                        "value": {
                          "fieldName": "countdistinct(creator)",
                          "displayName": "Creators over app threshold"
                        }
                      },
                      "frame": {
                        "showTitle": true,
                        "title": "Creators over app threshold",
                        "description": "Creators owning more apps than the threshold",
                        "showDescription": true
                      }
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 5,
                    "width": 4,
                    "height": 3
                  }
                },
                {
                  "widget": {
                    "name": "kpi_wasted_dbus",
                    "queries": [
                      {
                        "name": "main_query",
                        "query": {
                          "datasetName": "ds_apps",
                          "fields": [
                            {
                              "name": "sum(wasted_dbus)",
                              "expression": "SUM(`wasted_dbus`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      }
                    ],
                    "spec": {
                      "version": 2,
                      "widgetType": "counter",
                      "encodings": {
                        "value": {
                          "fieldName": "sum(wasted_dbus)",
                          "displayName": "Wasted DBUs (usage window)",
                          "format": {
                            "type": "number",
                            "abbreviation": "compact",
                            "decimalPlaces": {
                              "type": "max",
                              "places": 1
                            }
                          }
                        }
                      },
                      "frame": {
                        "showTitle": true,
                        "title": "Wasted DBUs (usage window)",
                        "description": "DBUs billed to apps with no human sign-ins and no human OBO users",
                        "showDescription": true
                      }
                    }
                  },
                  "position": {
                    "x": 4,
                    "y": 5,
                    "width": 4,
                    "height": 3
                  }
                },
                {
                  "widget": {
                    "name": "kpi_stopped",
                    "queries": [
                      {
                        "name": "main_query",
                        "query": {
                          "datasetName": "ds_apps",
                          "fields": [
                            {
                              "name": "sum(flag_stopped_or_never_deployed)",
                              "expression": "SUM(`flag_stopped_or_never_deployed`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      }
                    ],
                    "spec": {
                      "version": 2,
                      "widgetType": "counter",
                      "encodings": {
                        "value": {
                          "fieldName": "sum(flag_stopped_or_never_deployed)",
                          "displayName": "Stopped or never deployed"
                        }
                      },
                      "frame": {
                        "showTitle": true,
                        "title": "Stopped or never deployed",
                        "description": "Compute stopped or no active deployment",
                        "showDescription": true
                      }
                    }
                  },
                  "position": {
                    "x": 8,
                    "y": 5,
                    "width": 4,
                    "height": 3
                  }
                },
                {
                  "widget": {
                    "name": "ov_trends",
                    "multilineTextboxSpec": {
                      "lines": [
                        "## Trends (last 90 days)\n"
                      ]
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 8,
                    "width": 12,
                    "height": 1
                  }
                },
                {
                  "widget": {
                    "name": "spend_trend",
                    "queries": [
                      {
                        "name": "main_query",
                        "query": {
                          "datasetName": "ds_spend_trend",
                          "fields": [
                            {
                              "name": "daily(usage_date)",
                              "expression": "DATE_TRUNC(\"DAY\", `usage_date`)"
                            },
                            {
                              "name": "app_series",
                              "expression": "`app_series`"
                            },
                            {
                              "name": "sum(dbus)",
                              "expression": "SUM(`dbus`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      }
                    ],
                    "spec": {
                      "version": 3,
                      "widgetType": "bar",
                      "encodings": {
                        "x": {
                          "fieldName": "daily(usage_date)",
                          "scale": {
                            "type": "temporal"
                          },
                          "displayName": "Date"
                        },
                        "y": {
                          "fieldName": "sum(dbus)",
                          "scale": {
                            "type": "quantitative"
                          },
                          "displayName": "DBUs",
                          "format": {
                            "type": "number",
                            "abbreviation": "compact",
                            "decimalPlaces": {
                              "type": "max",
                              "places": 1
                            }
                          }
                        },
                        "color": {
                          "fieldName": "app_series",
                          "scale": {
                            "type": "categorical"
                          },
                          "displayName": "App (top 7 by DBUs)"
                        }
                      },
                      "frame": {
                        "showTitle": true,
                        "title": "Apps spend: daily DBUs by app"
                      }
                    }
                  },
                  "position": {
