resources:
  jobs:
    apps_monitoring:
      name: apps-monitoring
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC

      # Defaults come from bundle variables. Don't override these at run time:
      # the dashboard's dataset catalog/schema and table prefix are bound at
      # deploy time, so a change needs `bundle deploy --var ...`.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: name_prefix
          default: ${var.name_prefix}

      environments:
        # No pip dependencies, so the job runs where PyPI is unreachable.
        # Environment 5 preinstalls databricks-sdk 0.67.0; the snapshot task
        # needs >= 0.49.0 and checks it at startup.
        - environment_key: default
          spec:
            environment_version: "5"

      tasks:
        - task_key: snapshot_apps_inventory
          environment_key: default
          spark_python_task:
            python_file: ../src/snapshot_apps_inventory.py
            parameters:
              - --catalog
              - "{{job.parameters.catalog}}"
              - --schema
              - "{{job.parameters.schema}}"
              - --name-prefix
              - "{{job.parameters.name_prefix}}"

        - task_key: refresh_app_mvs
          depends_on:
            - task_key: snapshot_apps_inventory
          # Retry transient warehouse errors. Every step in the SQL file is idempotent.
          max_retries: 2
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/refresh_app_mvs.sql
              source: WORKSPACE
            parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              name_prefix: "{{job.parameters.name_prefix}}"

        - task_key: refresh_dashboard
          depends_on:
            - task_key: refresh_app_mvs
          dashboard_task:
            dashboard_id: ${resources.dashboards.apps_monitoring_dashboard.id}
            warehouse_id: ${var.warehouse_id}
