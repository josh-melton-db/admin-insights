resources:
  jobs:
    apps_monitoring:
      name: apps-monitoring
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC

      # Defaults come from bundle variables. Don't override these at run time:
      # the dashboard's dataset catalog/schema are bound at deploy time, so a
      # namespace change needs `bundle deploy --var catalog=... --var schema=...`.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - databricks-sdk>=0.60.0

      tasks:
        - task_key: snapshot_apps_inventory
          environment_key: default
          spark_python_task:
            python_file: ../src/snapshot_apps_inventory.py
            parameters:
              - --catalog
              - "{{job.parameters.catalog}}"
              - --schema
              - "{{job.parameters.schema}}"

        - task_key: refresh_app_mvs
          depends_on:
            - task_key: snapshot_apps_inventory
          # Retry transient warehouse errors. Every step in the SQL file is idempotent.
          max_retries: 2
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/refresh_app_mvs.sql
              source: WORKSPACE
            parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"

        - task_key: refresh_dashboard
          depends_on:
            - task_key: refresh_app_mvs
          dashboard_task:
            dashboard_id: ${resources.dashboards.apps_monitoring_dashboard.id}
            warehouse_id: ${var.warehouse_id}
