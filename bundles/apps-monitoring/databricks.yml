# Standalone bundle for Databricks Apps monitoring: an inventory snapshot +
# Apps MV refresh job and an AI/BI dashboard of deletion candidates.
# Deploy from this directory only. The repo-root databricks.yml deploys the
# live admin-insights app and is unrelated to this bundle.
# The workspace comes from --profile, and warehouse_id from
# .databricks/bundle/default/variable-overrides.json (see
# variable-overrides.example.json and README.md). Neither is committed.
bundle:
  name: apps-monitoring

include:
  - resources/*.yml

sync:
  exclude:
    - tests/**

variables:
  warehouse_id:
    description: >-
      Serverless SQL warehouse ID for the MV refresh task and dashboard.
      Required; set it in .databricks/bundle/default/variable-overrides.json
      or with --var warehouse_id=<id>.
  catalog:
    description: >-
      Catalog holding this bundle's <name_prefix>-prefixed Apps MVs and
      <name_prefix>apps_inventory_snapshot.
    default: demos
  schema:
    description: >-
      Schema holding this bundle's <name_prefix>-prefixed Apps MVs and
      <name_prefix>apps_inventory_snapshot.
    default: admin_insights
  name_prefix:
    description: >-
      Prepended to every UC object this bundle creates or refreshes
      (<prefix>apps_inventory_snapshot, <prefix>app_obo_activity_daily,
      <prefix>app_config_events_daily). Must match ^[A-Za-z0-9_]*$. Empty
      means the unprefixed names, which are the admin-insights app's shared MVs.
    default: ""

targets:
  default:
    default: true
    variables:
      name_prefix: monitor_
