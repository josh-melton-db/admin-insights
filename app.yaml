command: ['npm', 'run', 'start']
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: ADMIN_INSIGHTS_BOOTSTRAP_ADMINS
    value: 'admin@example.com'
  - name: ADMIN_INSIGHTS_ADMIN_GROUPS
    value: 'admins'
  - name: ADMIN_INSIGHTS_EXECUTION_MODE
    value: 'dry_run'
  - name: ADMIN_INSIGHTS_DEV_USER
    value: 'admin@example.com'
